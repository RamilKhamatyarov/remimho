syntax = "proto3";

package ru.rkhamatyarov.proto;

option java_multiple_files = true;

message GameStateDelta {
  optional double puck_x = 1;
  optional double puck_y = 2;
  optional double puck_vx = 3;
  optional double puck_vy = 4;
  optional double paddle1_y = 5;
  optional double paddle2_y = 6;
  optional int32 score_a = 7;
  optional int32 score_b = 8;
  optional bool paused = 9;
  repeated Line lines = 10;
  repeated PowerUp power_ups = 11;
  repeated ActivePowerUp active_power_ups = 12;
  optional bool full_state = 13;
  optional double elapsed_seconds = 14;
  optional double puck_spin = 15;
  optional int64 puck_spin_remaining_ms = 16;
  repeated TouchLedgerEntry touch_ledger = 17;
  optional OneTimerConfig one_timer_config = 18;
}

message Line {
  repeated Point points = 1;
  double width = 2;
  double animation_progress = 3;
  bool is_animating = 4;
  string id = 5;
  optional string owner_side = 6;
}

message Point {
  double x = 1;
  double y = 2;
}

message PowerUp {
  double x = 1;
  double y = 2;
  string type = 3;
  string emoji = 4;
  string color = 5;
  double radius = 6;
  string id = 7;
}

message ActivePowerUp {
  string type = 1;
  string emoji = 2;
  int64 remaining_seconds = 3;
}

message TouchLedgerEntry {
  string source = 1;
  optional string owner_side = 2;
  string identifier = 3;
  int64 elapsed_ns = 4;
  double speed_at_contact = 5;
}

message OneTimerConfig {
  double minimum_incoming_speed = 1;
  int64 freshness_window_ns = 2;
  double minimum_multiplier = 3;
  double maximum_multiplier = 4;
  double full_strength_incoming_speed = 5;
  double maximum_raw_speed = 6;
}
